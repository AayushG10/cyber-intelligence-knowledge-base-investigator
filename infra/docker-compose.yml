# Optional infrastructure. The app runs WITHOUT this (detection is in-process).
# Use this only if you want Neo4j (Bloom graph visualization) and/or Postgres.
#
#   docker compose -f infra/docker-compose.yml up -d
#
# Then set in .env:
#   NEO4J_URI=bolt://localhost:7687   NEO4J_USER=neo4j   NEO4J_PASSWORD=localdevpass
#   DATABASE_URL=postgresql+psycopg://postgres:localdevpass@localhost:5432/investigations

services:
  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"   # browser
      - "7687:7687"   # bolt
    environment:
      NEO4J_AUTH: neo4j/localdevpass
      # GDS + APOC so gds.* / apoc.* work locally (self-hosted only — Aura Free has no GDS)
      NEO4J_PLUGINS: '["graph-data-science","apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: gds.*,apoc.*
    volumes:
      - neo4j_data:/data

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: localdevpass
      POSTGRES_DB: investigations
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  neo4j_data:
  pg_data:
